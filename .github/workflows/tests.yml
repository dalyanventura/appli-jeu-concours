name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/pyproject.toml
      - run: pip install -e "collector[dev]"
      - name: Tests (no network, no secrets)
        working-directory: collector
        run: python -m pytest -q

  android:
    runs-on: ubuntu-latest   # Android SDK preinstalled
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # Publishable key only (public by design, protected by RLS). The secret key must never be here.
      - name: Unit tests + debug APK
        working-directory: android
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: android/app/build/reports/
          retention-days: 7
      # Downloadable from the run page (Artifacts) to install on a phone for testing
      - uses: actions/upload-artifact@v4
        with:
          name: concours-radar-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
