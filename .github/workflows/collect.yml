name: Collecte horaire

on:
  schedule:
    - cron: "17 * * * *"   # every hour at :17 (the top of the hour is GitHub's busiest, most delayed slot)
  workflow_dispatch:        # "Run workflow" button for a manual run

permissions:
  contents: read

concurrency:
  group: collect            # never two runs at once (quota guard + idempotent upserts assume it)
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/pyproject.toml
      # editable install: config/ (hashtags.yaml, categories.yaml) is read next to the sources
      - run: pip install -e collector
      - name: Collect
        working-directory: collector
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python -m collector.main
