# Hashtags interrogés à chaque passage du collecteur.
#
# ⚠️ Limite Instagram : 30 hashtags UNIQUES par fenêtre glissante de 7 jours, recherches comprises.
# Retirer un tag puis en ajouter un autre consomme les deux pendant 7 jours. Le collecteur refuse
# de démarrer si (tags interrogés ces 7 derniers jours) ∪ (cette liste) dépasse 30.
# On garde volontairement ~10 places de marge pour pouvoir ajuster la liste.
#
# Format : minuscules, sans '#', sans espace.

max_pages_per_tag: 3   # 50 publications par page → jusqu'à 150 par tag et par passage

hashtags:
  # Génériques
  - jeuconcours            # déjà utilisé en phase 0
  - jeuxconcours
  - jeuconcoursinstagram
  - concoursinstagram
  - concours
  - concoursfrance
  - jeuconcoursfrance
  - tirageausort
  - concoursgratuit
  - cadeauagagner
  - giveawayfrance
  - agagner
  # Thématiques
  - concoursbeaute
  - concoursmode
  - concoursdeco
  - concoursgaming
  - concourslivre
  - concourscuisine
  - concoursenfant
  - concoursvoyage
