# Thèmes : source de vérité des slugs (doivent correspondre à la table `categories`).
# Chaque mot-clé est une expression régulière cherchée en début de mot, dans la légende
# mise en minuscules et SANS accents (écrire « deco », pas « déco ») : « parfum » trouve « parfums ».
# Mettre \b à la fin pour exiger le mot entier. Un post peut avoir jusqu'à 3 thèmes
# (ceux qui ont le plus de mots-clés) ; sans aucun mot-clé → « autre ».
# Les hashtags de collecte comptent aussi (ex. #concoursbeaute → beaute_bien_etre).

